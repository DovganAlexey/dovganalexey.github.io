<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creature Crusher - Slime Horn Clicker</title>
<style>
    body { 
        margin: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: flex-start; 
        height: 100vh; 
        background: #1a1a1a; 
        font-family: monospace; 
        color: #fff; 
        overflow: hidden;
        cursor: none;
    }
    #ui { 
        width: 100%; 
        max-width: 1440px; 
        display: flex; 
        justify-content: space-between; 
        padding: 10px 20px; 
        font-size: 18px; 
        box-sizing: border-box; 
        flex-shrink: 0; 
    }
    canvas { 
        border: 2px solid #444; 
        cursor: none;
        display: block; 
        width: 100%; 
        flex-grow: 1; 
        box-sizing: border-box; 
        background: #222; 
    }
     #gameOver { 
        display: none; 
        position: fixed; 
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        flex-direction: column;
        align-items: center; 
        justify-content: center; 
        z-index: 1000;
        pointer-events: auto;
    }
    #gameOver h1 {
        font-size: 72px;
        color: #ff3333;
        text-shadow: 0 0 20px #ff0000, 4px 4px 0px #000;
        margin: 0 0 20px 0;
        font-family: 'Arial Black', sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    #gameOver p {
        font-size: 32px;
        color: #fff;
        margin: 10px 0;
        font-family: monospace;
    }
    #gameOver .final-score {
        color: #44ff44;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 0 0 10px #44ff44;
    }
    #gameOver .restart-hint {
        font-size: 20px;
        color: #aaa;
        margin-top: 40px;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
    }

    #hornCursor {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        width: 48px;
        height: 48px;
        background: url('horn.png') no-repeat center;
        background-size: contain;
        transform: translate(-50%, -50%);
        transition: transform 0.05s ease-out;
    }
    
        /* NEW: Visual state when on cooldown */
    #hornCursor.cooldown {
        opacity: 0.4;
        filter: grayscale(100%);
    }

    #hornCursor.squish {
        animation: hornSquish 0.3s ease-out;
    }

    @keyframes hornSquish {
        0% { transform: translate(-50%, -50%) scale(1, 1) rotate(0deg); }
        25% { transform: translate(-50%, -50%) scale(1.3, 0.7) rotate(-10deg); }
        50% { transform: translate(-50%, -50%) scale(0.9, 1.1) rotate(5deg); }
        75% { transform: translate(-50%, -50%) scale(1.05, 0.95) rotate(-2deg); }
        100% { transform: translate(-50%, -50%) scale(1, 1) rotate(0deg); }
    }
</style>
</head>
<body>

<a class="portfolio-home-link" href="../index.html" aria-label="Back to project archive">BACK TO ARCHIVE</a>
<style>
.portfolio-home-link {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2147483000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 22px 17px 22px 11px;

    background: rgba(15, 23, 42, 0.88);
    color: #f1f5f9 !important;

    border: 1px solid rgba(140, 150, 150, 0.45);
    border-left: none;
    border-radius: 0 50px 50px 0;

    font: 10px Arial, sans-serif;
    letter-spacing: 0.1em;
    text-decoration: none !important;

    writing-mode: vertical-rl;
    white-space: nowrap;

    backdrop-filter: blur(8px);
    box-shadow: 4px 0 18px rgba(0, 0, 0, 0.2);

    transition: 
        padding 0.3s ease,
        background 0.3s ease,
        color 0.3s ease;
}

.portfolio-home-link:hover {
    padding-left: 16px;
    padding-right: 22px;
    background: #c4f36a;
    color: #171916 !important;
    border-color: #c4f36a;
}

</style>
<div id="hornCursor"></div>

<div id="ui">
    <div>Score: <span id="score" class="green">0</span></div>
    <div>Missed: <span id="missed" class="red">0</span> / 10</div>
    <div>Level: <span id="level">1</span></div>
</div>
<canvas id="game"></canvas>
<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore" class="final-score">0</span></p>
    <p class="restart-hint">Click anywhere to restart</p>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const missedEl = document.getElementById('missed');
const levelEl = document.getElementById('level');
const gameOverEl = document.getElementById('gameOver');
const hornCursor = document.getElementById('hornCursor');

let score = 0, missed = 0, level = 1;
let creatures = [];
let gameOver = false;
let spawnTimer = 0;
let spawnRate = 90;

let mouseX = -9999, mouseY = -9999;

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

const hornSounds = [
    new Audio('horn_1.mp3'),
    new Audio('horn_2.mp3'),
    new Audio('horn_3.mp3'),
    new Audio('horn_4.mp3')
];
hornSounds.forEach(sound => sound.volume = 0.5);

function playHornSound() {
    // Clone the node to allow overlapping sounds
    const randomIndex = Math.floor(Math.random() * hornSounds.length);
    const sound = hornSounds[randomIndex].cloneNode();
    sound.volume = 0.5;
    sound.play().catch(e => console.log("Audio play failed:", e));
}

function playSquishSound() {
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    noise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    noise.start(audioCtx.currentTime);
}

const angleX = 60 * (Math.PI / 180);
const angleY = 0 * (Math.PI / 180);
let fov = 800;

const table = { minX: -1000, maxX: 1000, minZ: -600, maxZ: 600 };

function resizeCanvas() {
    const uiHeight = document.getElementById('ui').offsetHeight || 50;
    canvas.width = Math.max(100, window.innerWidth);
    canvas.height = Math.max(100, window.innerHeight - uiHeight);
    updateProjection();
}

function projectRaw(x, y, z, testFov) {
    let x1 = x * Math.cos(angleY) - z * Math.sin(angleY);
    let z1 = x * Math.sin(angleY) + z * Math.cos(angleY);
    let y1 = y;
    let y2 = y1 * Math.cos(angleX) - z1 * Math.sin(angleX);
    let z2 = y1 * Math.sin(angleX) + z1 * Math.cos(angleX);
    let x2 = x1;
    let cz = z2 + 2500; 
    if (cz <= 0) return null;
    let scale = testFov / cz;
    return { x: canvas.width / 2 + x2 * scale, y: canvas.height / 2 + y2 * scale, scale: scale, cz: cz };
}

function updateProjection() {
    const corners = [
        projectRaw(table.minX, 0, table.minZ, 1000),
        projectRaw(table.maxX, 0, table.minZ, 1000),
        projectRaw(table.maxX, 0, table.maxZ, 1000),
        projectRaw(table.minX, 0, table.maxZ, 1000)
    ];
    if (corners.some(c => !c)) return;
    const minX = Math.min(...corners.map(c => c.x));
    const maxX = Math.max(...corners.map(c => c.x));
    const minY = Math.min(...corners.map(c => c.y));
    const maxY = Math.max(...corners.map(c => c.y));
    const screenWidth = maxX - minX;
    const screenHeight = maxY - minY;
    const fovX = 1000 * (canvas.width * 0.8) / screenWidth;
    const fovY = 1000 * (canvas.height * 0.8) / screenHeight;
    fov = Math.min(fovX, fovY);
}

function project(x, y, z) { return projectRaw(x, y, z, fov); }

class Creature {
    constructor() {
        // CHANGED: Increased from 45 to 70
        this.r = 70; 
        this.x = Math.random() * (table.maxX - table.minX) + table.minX;
        this.y = -this.r;
        this.z = Math.random() * (table.maxZ - table.minZ) + table.minZ;
        
        let speed = 1.5 + (level * 0.3);
        let angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vz = Math.sin(angle) * speed;
        
        this.lifespan = 300 - (level * 10);
        if (this.lifespan < 100) this.lifespan = 100;
        this.alive = true;
        this.proj = null;
        this.time = Math.random() * 100;
        this.squishing = false;
        this.squishTime = 0;
        this.isHovered = false;
    }

    update() {
                // Freeze movement while squishing
        if (this.squishing) {
            this.squishTime += 0.15;
            if (this.squishTime > 1) { this.squishing = false; this.squishTime = 0; }
            return; 
        }
        this.x += this.vx;
        this.z += this.vz;
        if (this.x < table.minX || this.x > table.maxX) this.vx *= -1;
        if (this.z < table.minZ || this.z > table.maxZ) this.vz *= -1;

        this.lifespan--;
        if (this.lifespan <= 0) {
            this.alive = false;
            missed++;
            missedEl.textContent = missed;
            if (missed >= 10) triggerGameOver();
        }
        if (this.squishing) {
            this.squishTime += 0.15;
            if (this.squishTime > 1) { this.squishing = false; this.squishTime = 0; }
        }
    }

    triggerSquish() { this.squishing = true; this.squishTime = 0; }

    draw() {
        if (!this.proj) return;
        let screenR = this.r * this.proj.scale;
        if (screenR < 2) return;

        this.time += 0.15;

        let squishScaleX = 1;
        let squishScaleY = 1;
        if (this.squishing) {
            const phase = this.squishTime;
            if (phase < 0.25) { squishScaleX = 1 + (phase / 0.25) * 0.3; squishScaleY = 1 - (phase / 0.25) * 0.3; } 
            else if (phase < 0.5) { squishScaleX = 1.3 - ((phase - 0.25) / 0.25) * 0.4; squishScaleY = 0.7 + ((phase - 0.25) / 0.25) * 0.4; } 
            else if (phase < 0.75) { squishScaleX = 0.9 + ((phase - 0.5) / 0.25) * 0.15; squishScaleY = 1.1 - ((phase - 0.5) / 0.25) * 0.15; } 
            else { squishScaleX = 1.05 - ((phase - 0.75) / 0.25) * 0.05; squishScaleY = 0.95 + ((phase - 0.75) / 0.25) * 0.05; }
        }

        let shadowProj = project(this.x, 0, this.z);
        if (shadowProj) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(shadowProj.x, shadowProj.y, screenR * 0.9 * squishScaleX, screenR * 0.4 * squishScaleY, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // CHANGED: Reduced bounce from 0.2 to 0.06, and bodyYOffset from 0.25 to 0.08
        let bounce = Math.sin(this.time * 2) * 0.06;
        let animScaleX = (1 + bounce) * squishScaleX;
        let animScaleY = (1 - bounce) * squishScaleY;
        let bodyYOffset = -Math.abs(Math.sin(this.time * 2)) * screenR * 0.08;
        
        let cx = this.proj.x;
        let cy = this.proj.y + bodyYOffset;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(animScaleX, animScaleY);

        ctx.fillStyle = this.lifespan < 60 ? '#aa0000' : '#ff6600'; 
        ctx.beginPath();
        ctx.arc(0, 0, screenR, 0, Math.PI * 2);
        ctx.fill();
        
        if (this.isHovered) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = screenR * 0.15;
            ctx.stroke();
        }
        
        ctx.strokeStyle = '#993300';
        ctx.lineWidth = screenR * 0.05;
        ctx.stroke();

        let eyeW = screenR * 0.45;
        let eyeH = screenR * 0.45;
        let blinkCycle = Math.floor(this.time * 5) % 60;
        if (blinkCycle === 0) eyeH = screenR * 0.05;

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(0, -screenR * 0.15, eyeW, eyeH, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = screenR * 0.03;
        ctx.stroke();

        if (blinkCycle !== 0) {
            let pupilOffsetX = Math.sign(this.vx) * screenR * 0.15;
            let pupilOffsetY = Math.sign(this.vz) * screenR * 0.1; 
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(pupilOffsetX, -screenR * 0.15 + pupilOffsetY, screenR * 0.18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(pupilOffsetX - screenR*0.05, -screenR * 0.15 + pupilOffsetY - screenR*0.05, screenR * 0.05, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.strokeStyle = '#000';
        ctx.lineWidth = screenR * 0.06;
        ctx.beginPath();
        ctx.arc(0, screenR * 0.35, screenR * 0.25, 0.1, Math.PI - 0.1);
        ctx.stroke();

        ctx.restore();
    }

    hit(mx, my) {
        if (!this.proj) return false;
        // Prevent hitting an enemy that is already dying/squishing
        if (this.squishing) return false; 
        
        let screenR = this.r * this.proj.scale;
        let dx = mx - this.proj.x;
        let dy = my - this.proj.y;
        // Tightened hitbox to 15% larger (still forgiving, but won't kill background enemies)
        return Math.sqrt(dx*dx + dy*dy) < (screenR * 1.15);
    }
}

function spawnCreature() { creatures.push(new Creature()); }

function drawTable() {
    const h = 60;
    const p = [
        project(table.minX, 0, table.minZ), project(table.maxX, 0, table.minZ),
        project(table.maxX, 0, table.maxZ), project(table.minX, 0, table.maxZ),
        project(table.minX, h, table.minZ), project(table.maxX, h, table.minZ),
        project(table.maxX, h, table.maxZ), project(table.minX, h, table.maxZ)
    ];
    if (p.some(c => !c)) return;

    ctx.fillStyle = '#654321';
    ctx.beginPath(); ctx.moveTo(p[1].x, p[1].y); ctx.lineTo(p[2].x, p[2].y);
    ctx.lineTo(p[6].x, p[6].y); ctx.lineTo(p[5].x, p[5].y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4a3018'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#5c3a1e';
    ctx.beginPath(); ctx.moveTo(p[2].x, p[2].y); ctx.lineTo(p[3].x, p[3].y);
    ctx.lineTo(p[7].x, p[7].y); ctx.lineTo(p[6].x, p[6].y); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#8b4513';
    ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y);
    ctx.lineTo(p[2].x, p[2].y); ctx.lineTo(p[3].x, p[3].y); ctx.closePath(); ctx.fill();
    
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
        let t = i / 4;
        let xVal = table.minX + (table.maxX - table.minX) * t;
        let px1 = project(xVal, 0, table.minZ), px2 = project(xVal, 0, table.maxZ);
        if (px1 && px2) { ctx.beginPath(); ctx.moveTo(px1.x, px1.y); ctx.lineTo(px2.x, px2.y); ctx.stroke(); }
        let zVal = table.minZ + (table.maxZ - table.minZ) * t;
        let pz1 = project(table.minX, 0, zVal), pz2 = project(table.maxX, 0, zVal);
        if (pz1 && pz2) { ctx.beginPath(); ctx.moveTo(pz1.x, pz1.y); ctx.lineTo(pz2.x, pz2.y); ctx.stroke(); }
    }
}

function update() {
    if (gameOver) return;
    spawnTimer++;
    if (spawnTimer >= spawnRate) { spawnCreature(); spawnTimer = 0; }
    creatures.forEach(c => c.update());
    creatures = creatures.filter(c => c.alive);
    let newLevel = Math.floor(score / 10) + 1;
    if (newLevel !== level) {
        level = newLevel;
        levelEl.textContent = level;
        spawnRate = Math.max(20, 90 - (level * 5));
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTable();
    creatures.forEach(c => { 
        c.proj = project(c.x, c.y, c.z); 
        c.isHovered = c.hit(mouseX, mouseY);
    });
    creatures.sort((a, b) => (b.proj ? b.proj.cz : 0) - (a.proj ? a.proj.cz : 0));
    creatures.forEach(c => { if (c.proj) c.draw(); });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.addEventListener('mousemove', (e) => {
    hornCursor.style.left = e.clientX + 'px';
    hornCursor.style.top = e.clientY + 'px';
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;
});

canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });
// Add this near your other variable declarations at the top of the script:
const finalScoreEl = document.getElementById('finalScore');
let isHornReady = true; 
let hornTimeout;

// ... (keep your mousemove and mouseleave listeners exactly as they are) ...

// REPLACED mousedown: Only handles visual squish now
document.addEventListener('mousedown', () => {
    hornCursor.classList.remove('squish');
    void hornCursor.offsetWidth; 
    hornCursor.classList.add('squish');
});

// REPLACED click: Handles the actual hit and cooldown logic
canvas.addEventListener('click', (e) => {
    if (gameOver) { 
        resetGame(); 
        return; 
    }
    
    // Block hit if cooling down
    if (!isHornReady) return; 

    // Lock the horn immediately
    isHornReady = false;
    hornCursor.classList.add('cooldown');

    if (audioCtx.state === 'suspended') audioCtx.resume();
    playHornSound();

    // Hit detection
    for (let i = creatures.length - 1; i >= 0; i--) {
        if (creatures[i].hit(mouseX, mouseY)) {
            const target = creatures[i]; 
            target.triggerSquish();
            playSquishSound();
            setTimeout(() => { target.alive = false; }, 300);
            score++;
            scoreEl.textContent = score;
            break;
        }
    }

    // Start 1 second cooldown
    clearTimeout(hornTimeout);
    hornTimeout = setTimeout(() => {
        isHornReady = true;
        hornCursor.classList.remove('cooldown');
    }, 1000);
});

// REPLACED triggerGameOver: Updates the fancy screen
function triggerGameOver() {
    gameOver = true;
    finalScoreEl.textContent = score;
    gameOverEl.style.display = 'flex'; // Use flex to center the overlay content
}
function resetGame() {
    score = 0; missed = 0; level = 1;
    spawnRate = 90; spawnTimer = 0;
    creatures = [];
    scoreEl.textContent = 0; missedEl.textContent = 0; levelEl.textContent = 1;
    gameOver = false;
    gameOverEl.style.display = 'none';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
loop();
</script>
